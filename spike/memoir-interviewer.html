<script>
(() => {
"use strict";

// ───────────────────────── 프롬프트 (skills/life-story-interviewer/SKILL.md 기반) ─────────────────────────
const PERIODS = ["유년", "학창", "청년", "가정·중년", "지금"];
const FUNNEL = ["열기", "장면", "감각", "인물·대사", "감정", "의미"];

const INTERVIEWER_RULES = `너는 한국어로 인생 이야기를 듣는 인터뷰어다. 화자(주로 부모님 세대)와 대화하며 기억을 끌어내 회고록 재료를 모은다. 기록과 원고는 다른 담당이 하니, 너는 대화만 한다.

[출력 형식 — 반드시 지킬 것]
- 화자에게 건넬 말 한 턴만 쓴다. 마크다운, 제목, 목록, 따옴표로 감싼 설명, 괄호 속 메모 금지.
- 매 턴 = [짧은 공감·되짚기 1문장] + [질문 1개]. 질문은 절대 두 개 이상 묶지 않는다.
- 전체 2~3문장, 정중한 존댓말, 짧은 문장. 전문용어·영어 금지.
- 답이 길면 요약하지 말고 그중 가장 구체적인 단어 하나를 집어 다음 질문을 만든다.
- "정말 감동적이네요" 같은 칭찬·감탄을 반복하지 않는다. 화자의 기억을 정정하거나 판단하지 않는다.

[시작할 때 (화자 정보가 비어 있으면)]
한 번에 하나씩, 최대 3개만 확인한다: ① 누가 답하는지 — 본인이 직접인지, 자녀가 옆에서 대신 입력하는지 ② 화자의 호칭, 대략의 출생 연도, 태어난 곳 ③ 책의 용도(칠순 선물, 가족 기록 등).
자녀가 대신 입력한다면 이후 질문은 "어머님께 이렇게 여쭤봐 주세요: …" 형식으로 건네고, 답은 화자의 말 그대로 적어 달라고 한 번 부탁한다.

[인생 지도 (첫 세션)]
깊이 들어가기 전에 가볍게 큰 그림을 묻는다: 태어나고 자란 곳과 이사한 곳, 가족 구성(부모, 형제자매 순서), 학교·첫 직장·결혼·자녀 같은 이정표. 그다음 시기 목록(유년/학창/청년/가정·중년/지금)을 한 칸씩 채워 나간다.

[깔때기 — 한 에피소드 안에서 이 순서로 내려간다]
1 열기("어릴 적 살던 집 하면 뭐가 먼저 떠오르세요?") → 2 장면(언제·어디·누구와) → 3 감각(보이던 것, 소리, 냄새, 맛, 날씨) → 4 인물·대사("그때 아버지가 뭐라고 하셨는지 기억나세요?") → 5 감정 → 6 의미("지금 돌아보면 그 일이 어떤 의미였던 것 같으세요?").
4단계 이상 채워지면 방금 나온 내용과 연결해 주제를 바꾼다("아까 큰오빠 얘기를 하셨는데, 형제분들 중에 누구랑 제일 가까우셨어요?").

[답이 짧거나 "기억 안 나"일 때]
질문을 더 좁고 구체적으로 바꾼다. 기억 단서 하나를 준다(계절·명절, 음식, 노래·라디오, 장소, 물건, 사진, 화자 나이에 맞는 당시 시대 사건). 둘 중 고르는 선택지를 준다. 두 번 시도해도 안 나오면 부드럽게 다른 주제로 넘어간다. 절대 캐묻지 않는다.

[이야기가 풍부할 때]
흐름을 끊지 않는다. "그래서요?", "그다음엔 어떻게 됐어요?"처럼 짧게 이어 준다.

[시기별 질문 씨앗 — 그대로 읽지 말고 대화에 맞게 변형]
유년: 살던 집 구조, 동네 놀이, 부모님의 하루, 혼났던 일, 명절 풍경, 제일 좋아한 음식
학창: 등굣길, 기억나는 선생님, 단짝, 꿈, 교복·도시락, 공부를 계속할 수 있었는지
청년: 집을 떠난 순간, 첫 직장과 첫 월급, 그 돈을 어디에 썼는지, 배우자를 만난 이야기, 가장 힘들었던 시기와 버틴 방법
가정·중년: 첫아이가 태어난 날, 살림·일의 고비, 자랑스러운 순간, 후회
지금: 가장 감사한 사람, 자녀·손주에게 남기고 싶은 말

[민감한 이야기]
상실, 가난, 전쟁, 질병, 갈등이 나오면 속도를 늦춘다. 공감 한 문장 뒤 "이 이야기는 더 하셔도 되고, 넘어가셔도 괜찮아요"라고 선택권을 준다. 상담사처럼 해석하거나 진단하지 않는다.

[화자의 버튼 명령 — 대화에 "[버튼] …"으로 들어온다]
- 다음 시기로: 지금 시기를 따뜻하게 한 문장으로 마무리하고 다음 시기의 열기 질문을 한다.
- 잘 기억이 안 나요: 위의 "답이 짧을 때" 방법을 쓴다.
- 이 이야기는 넘어갈게요: 아무것도 묻지 말고 존중한 뒤 다른 주제로 옮긴다.
- 오늘은 여기까지: 오늘 들은 이야기를 따뜻하게 2~3문장으로 되짚고, 다음에 이어 갈 주제 하나를 예고하고, 사진이나 물건이 있으면 다음에 같이 보자고 제안한다. 이때는 질문하지 않는다.
대화가 오늘 30~40턴쯤 이어졌으면 스스로 마무리를 제안한다.`;

const RECORDER_RULES = `너는 회고록 인터뷰의 기록자다. 인터뷰 대화를 읽고 기록 상태(JSON)를 갱신한다.
원칙: 대화에 실제로 나온 내용만 적는다. 추측·창작 금지. 연도·지명이 불확실하면 uncertain에 적는다. 화자가 넘어가고 싶다거나 책에 넣지 말라고 한 내용은 visibility를 "비공개"로, 제3자(형제·이웃 등)의 사생활·명예가 걸린 내용은 "확인 필요"로 둔다. quotes에는 화자의 원래 표현을 한 글자도 바꾸지 말고 그대로 옮긴다(인상적인 구절 위주, 최대 5개).

출력: 아래 형태의 JSON 하나만. 기존 에피소드는 id를 유지하며 내용을 보강하고, 새 이야기면 새 id(e1, e2…)로 추가한다. 인생 지도(가족 구성·이사·이정표)는 profile.lifeMap에 짧게 누적한다.
{
  "profile": {"respondent":"본인|자녀 대리|미정","honorific":"호칭(예: 어머니, 김영자 님)","birthYear":"","birthplace":"","purpose":"","lifeMap":""},
  "currentPeriod": "유년|학창|청년|가정·중년|지금|시작",
  "currentEpisodeId": "e3 또는 빈 문자열",
  "periods": {"유년":0,"학창":0,"청년":0,"가정·중년":0,"지금":0},
  "episodes": [
    {"id":"e1","title":"화자 표현을 살린 제목","period":"유년","age":"","place":"","people":"","story":"사실만 3~5문장","senses":"","quotes":["…"],"emotion":"","meaning":"","uncertain":"","visibility":"공개|비공개|확인 필요","funnel":["열기","장면"]}
  ]
}
periods 값은 그 시기의 채움 정도 0~3 (0 없음, 1 조금, 2 꽤, 3 충분). funnel은 깔때기 단계(열기, 장면, 감각, 인물·대사, 감정, 의미) 중 그 에피소드에서 실제로 채워진 단계만.`;

const EDITOR_RULES = `너는 회고록 편집자다. 아래 에피소드 카드만 재료로 써서 책의 한 장(chapter)을 쓴다.
- 지어내지 않는다. 카드에 없는 사실·대사·감정을 만들지 않는다. 장면을 잇는 연결 문장은 허용하되 새 사건은 금지. 불확실한 부분은 본문에 [확인 필요: …]로 남긴다.
- 화자의 목소리로 1인칭("나는") 회고체. 화자가 쓴 단어, 사투리, 말버릇을 살리고 quotes의 원래 표현은 최대한 그대로 쓴다.
- 구어체의 반복·머뭇거림은 정리하되 문장을 화려하게 꾸미지 않는다.
- 단락은 장면 → 감정 → 의미 순. 사진이 어울리는 곳에 [사진: 설명] 자리 표시를 한두 개 넣어도 된다.
- 출력 형식: 첫 줄에 장 제목만(화자 표현에서 따온 짧은 제목, 기호 없이), 빈 줄, 그다음 본문. 마크다운 기호(#, *, -) 쓰지 않는다. 문단 사이 빈 줄.`;

// ───────────────────────── 상태 ─────────────────────────
const blankState = () => ({
  profile: { respondent: "미정", honorific: "", birthYear: "", birthplace: "", purpose: "", lifeMap: "" },
  currentPeriod: "시작", currentEpisodeId: "",
  periods: { "유년": 0, "학창": 0, "청년": 0, "가정·중년": 0, "지금": 0 },
  episodes: []
});
let S = blankState();
let chat = [];         // {role:"assistant"|"user", content, cmd?:true, day}
let book = {};         // {period: {title, body}}
let sample = null, tts = null, downloads = null;

const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) n.append(k);
  return n;
};
const today = () => new Date().toISOString().slice(0, 10);

// ───────────────────────── 저장: 비공개 db, 없으면 이 브라우저 ─────────────────────────
const store = {
  db: null, base: null,
  async init() {
    try {
      const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
      if (db && user) {
        const id = await user.id();
        if (id) { this.db = db; this.base = "data/users/" + id + "/memoir/"; }
      }
    } catch (_) {}
  },
  async load(key) {
    if (this.db) {
      try { const s = await this.db.doc(this.base + key).get(); if (s.exists) return s.data(); return null; } catch (_) {}
    }
    try { const raw = localStorage.getItem("memoir-" + key); return raw ? JSON.parse(raw) : null; } catch (_) { return null; }
  },
  timers: {},
  save(key, obj) {
    clearTimeout(this.timers[key]);
    this.timers[key] = setTimeout(async () => {
      if (this.db) { try { await this.db.doc(this.base + key).set(obj); return; } catch (_) {} }
      try { localStorage.setItem("memoir-" + key, JSON.stringify(obj)); } catch (_) {}
    }, 600);
  },
  async clear() {
    for (const k of ["state", "chat", "book"]) {
      if (this.db) { try { await this.db.doc(this.base + k).delete(); } catch (_) {} }
      try { localStorage.removeItem("memoir-" + k); } catch (_) {}
    }
  }
};
const saveAll = () => {
  store.save("state", { s: S });
  store.save("chat", { m: chat.slice(-300) });
  store.save("book", { b: book });
};

// ───────────────────────── 화면: 헤더 ─────────────────────────
function renderHeader() {
  const p = S.profile;
  const bits = [p.honorific, p.birthYear && p.birthYear + "년생", p.birthplace && p.birthplace + " 출생"].filter(Boolean);
  $("who").textContent = bits.length ? bits.join(" · ") : "체험판 · 기록은 나만 볼 수 있어요";
  const box = $("periods"); box.replaceChildren();
  for (const name of PERIODS) {
    const n = Math.max(0, Math.min(3, Number(S.periods?.[name]) || 0));
    box.append(el("span", { class: "period" + (S.currentPeriod === name ? " now" : "") },
      name, el("span", { class: "dots", "aria-label": `${n}/3`, text: "●".repeat(n) + "○".repeat(3 - n) })));
  }
  $("card-count").textContent = S.episodes.length ? String(S.episodes.length) : "";
}

// ───────────────────────── 화면: 인터뷰 ─────────────────────────
function msgNode(m) {
  if (m.cmd) return el("div", { class: "msg cmd", text: "— " + m.content + " —" });
  const n = el("div", { class: "msg " + (m.role === "assistant" ? "ai" : "me") });
  n.textContent = m.content;
  if (m.role === "assistant" && tts) {
    const b = el("button", { class: "icon small speak", title: "소리로 듣기", text: "🔊" });
    b.addEventListener("click", () => speak(m.content));
    n.append(b);
  }
  return n;
}
function renderChat() {
  const box = $("chat"); box.replaceChildren(...chat.map(msgNode));
  const started = chat.length > 0;
  $("start").hidden = started; box.hidden = !started; $("composer").hidden = !started;
}
const scrollDown = () => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

function turnsForModel() {
  const recent = chat.slice(-40);
  const turns = recent.map((m) => ({ role: m.role, content: m.cmd ? "[버튼] " + m.content : m.content }));
  return turns;
}
function stateBrief() {
  const todayTurns = chat.filter((m) => m.day === today() && m.role === "user").length;
  const eps = S.episodes.map((e) => `- ${e.id} [${e.period}] ${e.title} — 깔때기: ${(e.funnel || []).join(", ") || "없음"}${e.visibility !== "공개" ? " (" + e.visibility + ")" : ""}`).join("\n");
  return `[기록자가 정리한 현재 상태]
화자: ${JSON.stringify(S.profile)}
지금 시기: ${S.currentPeriod} / 지금 다루는 에피소드: ${S.currentEpisodeId || "없음"}
시기별 채움(0~3): ${PERIODS.map((p) => p + " " + (S.periods?.[p] || 0)).join(", ")}
지금까지의 에피소드:
${eps || "(아직 없음)"}
오늘 화자가 답한 횟수: ${todayTurns}
${chat.length && chat[0].day !== today() && chat[chat.length - 1].day !== today() ? "※ 오늘은 새 세션이다. 반갑게 인사하고 지난번 이야기를 한 문장으로 떠올린 뒤 이어서 묻는다." : ""}`;
}

let busy = false, ctl = null;
async function interviewerTurn() {
  busy = true; setComposer();
  const thinking = el("div", { class: "msg ai thinking", text: "생각하는 중…" });
  $("chat").append(thinking); scrollDown();
  ctl = new AbortController();
  const lead = { role: "user", content: INTERVIEWER_RULES + "\n\n" + stateBrief() +
    (chat.length ? "\n\n아래는 지금까지의 대화다. 인터뷰어로서 다음 한 턴만 말하라." : "\n\n지금 인터뷰를 시작한다. 짧게 인사하고 시작 질문 하나만 하라.") };
  let input = [lead, ...turnsForModel()];
  if (input[input.length - 1].role !== "user") input.push({ role: "user", content: "(화자가 아직 답하지 않았다. 방금 질문을 더 쉽게 다시 물어라.)" });
  try {
    const { text } = await sample(input, {
      cache: false, signal: ctl.signal,
      onText: ({ text }) => { thinking.classList.remove("thinking"); thinking.textContent = text; }
    });
    const reply = text.trim();
    thinking.remove();
    const m = { role: "assistant", content: reply, day: today() };
    chat.push(m); $("chat").append(msgNode(m)); scrollDown();
    saveAll();
    if ($("tts-toggle").checked) speak(reply);
  } catch (e) {
    thinking.remove();
    showError(e, interviewerTurn);
  } finally {
    busy = false; setComposer(); $("input").focus();
  }
}
function errCopy(code) {
  return ({
    not_granted: "Claude 사용을 허용해야 인터뷰를 할 수 있어요. 페이지를 새로 열고 '허용'을 눌러 주세요.",
    rate_limited: "요청이 많아 잠시 쉬어야 해요. 1분쯤 뒤에 다시 시도해 주세요.",
    cancelled: "멈췄어요.",
  })[code] || "답을 받아오지 못했어요. 다시 시도해 주세요.";
}
function showError(e, retry) {
  const box = el("div", { class: "err" }, el("span", { text: errCopy(e && e.code) }));
  if (e && e.code !== "not_granted") {
    const b = el("button", { class: "ghost small", text: "다시 시도" });
    b.addEventListener("click", () => { box.remove(); retry(); });
    box.append(b);
  }
  $("chat").append(box); scrollDown();
}
function setComposer() {
  $("btn-send").disabled = busy;
  for (const c of document.querySelectorAll(".chip")) c.disabled = busy;
}
function send(text, cmd = false) {
  text = text.trim();
  if (!text || busy || !sample) return;
  const m = { role: "user", content: text, day: today() };
  if (cmd) m.cmd = true;
  chat.push(m); $("chat").append(msgNode(m));
  $("input").value = ""; $("partial").textContent = ""; autosize();
  saveAll();
  interviewerTurn();
  if (!cmd || text === "다음 시기로" || text === "이 이야기는 넘어갈게요") queueRecord();
}

// ───────────────────────── 기록자 (뒤에서 카드 갱신) ─────────────────────────
let recChain = Promise.resolve(), recPending = 0;
function queueRecord() {
  recPending++; recStatus();
  recChain = recChain.then(record).catch(() => {}).finally(() => { recPending--; recStatus(); });
}
function recStatus() { $("rec-status").textContent = recPending ? "이야기 카드 정리 중…" : (S.episodes.length ? `이야기 카드 ${S.episodes.length}장` : ""); }
async function record() {
  const recent = chat.slice(-12).map((m) => (m.role === "assistant" ? "인터뷰어: " : "화자: ") + (m.cmd ? "[버튼] " : "") + m.content).join("\n");
  const prompt = RECORDER_RULES + "\n\n[현재 기록 상태 JSON]\n" + JSON.stringify(S) + "\n\n[최근 대화 — 마지막 화자 답변을 반영하라]\n" + recent;
  try {
    const next = await sample.json(prompt, { cache: false });
    if (next && typeof next === "object" && Array.isArray(next.episodes)) {
      S = { ...blankState(), ...next, profile: { ...blankState().profile, ...(next.profile || {}) }, periods: { ...blankState().periods, ...(next.periods || {}) } };
      S.episodes = S.episodes.filter((e) => e && e.id).map((e) => ({ ...e, quotes: Array.isArray(e.quotes) ? e.quotes : [], funnel: Array.isArray(e.funnel) ? e.funnel : [] }));
      saveAll(); renderHeader(); renderCards(); renderBook();
    }
  } catch (_) { /* 다음 답변 때 다시 정리됩니다 */ }
}

// ───────────────────────── 화면: 기록 카드 ─────────────────────────
function renderCards() {
  const box = $("cards"); box.replaceChildren();
  const p = S.profile;
  if (p.lifeMap || p.honorific) {
    const dl = el("dl");
    const add = (k, v) => { if (v) dl.append(el("dt", { text: k }), el("dd", { text: v })); };
    add("답하는 분", p.respondent); add("호칭", p.honorific); add("출생", [p.birthYear, p.birthplace].filter(Boolean).join(", "));
    add("책의 용도", p.purpose); add("인생 지도", p.lifeMap);
    box.append(el("div", { class: "card" }, el("h3", { text: "화자와 인생 지도" }), dl));
  }
  if (!S.episodes.length) {
    box.append(el("p", { class: "empty", text: "아직 정리된 이야기가 없어요. 인터뷰에서 한두 가지 이야기를 나누면 여기에 카드가 생깁니다." }));
    return;
  }
  for (const e of S.episodes) {
    const h = el("h3", { text: e.title || "제목 없음" });
    if (e.visibility === "비공개") h.append(el("span", { class: "badge private", text: "비공개" }));
    if (e.visibility === "확인 필요") h.append(el("span", { class: "badge check", text: "확인 필요" }));
    const dl = el("dl");
    const add = (k, v) => { if (v && String(v).trim()) dl.append(el("dt", { text: k }), el("dd", { text: v })); };
    add("장소", e.place); add("등장인물", e.people); add("줄거리", e.story); add("감각", e.senses);
    add("원래 표현", e.quotes.map((q) => "“" + q + "”").join("\n")); add("감정·의미", [e.emotion, e.meaning].filter(Boolean).join(" / "));
    add("확인 필요", e.uncertain);
    const funnel = el("div", { class: "funnel" });
    FUNNEL.forEach((f, i) => { const on = e.funnel.includes(f); funnel.append(on ? el("b", { text: f }) : f); if (i < FUNNEL.length - 1) funnel.append(" · "); });
    box.append(el("div", { class: "card" }, h, el("div", { class: "meta", text: [e.id, e.period, e.age].filter(Boolean).join(" · ") }), dl, funnel));
  }
}

// ───────────────────────── 화면: 책 ─────────────────────────
function chaptersPlan() {
  return PERIODS.map((p) => ({ period: p, eps: S.episodes.filter((e) => e.period === p && e.visibility !== "비공개") })).filter((c) => c.eps.length);
}
function renderBook() {
  const box = $("book"); box.replaceChildren();
  const plan = chaptersPlan();
  const name = S.profile.honorific || "나";
  box.append(el("div", { class: "cover" }, el("h2", { text: name + "의 이야기" }),
    el("p", { text: [S.profile.birthYear && S.profile.birthYear + "년", S.profile.birthplace].filter(Boolean).join(", ") + (S.profile.purpose ? " · " + S.profile.purpose : "") })));
  const hasText = plan.some((c) => book[c.period]?.body);
  $("btn-dl-html").hidden = !hasText || !downloads; $("btn-dl-txt").hidden = !hasText || !downloads;
  $("btn-book-all").hidden = !plan.length;
  if (!plan.length) {
    box.append(el("p", { class: "empty", text: "이야기 카드가 모이면 시기별로 장이 생겨요. 한 시기에 이야기가 두세 개쯤 모이면 써 보시길 권해요." }));
    return;
  }
  plan.forEach((c, i) => {
    const ch = book[c.period] || {};
    const body = el("div", { class: "body", contenteditable: "true", "aria-label": c.period + " 장 본문" });
    body.textContent = ch.body || "";
    body.addEventListener("blur", () => { book[c.period] = { ...(book[c.period] || {}), body: body.innerText.trim() }; saveAll(); });
    const btn = el("button", { class: "ghost small", text: ch.body ? "다시 쓰기" : "이 장 쓰기" });
    btn.addEventListener("click", () => writeChapter(c, body, btn, title));
    const title = el("h3", { text: ch.title || c.period + " 시절" });
    box.append(el("article", { class: "chapter" },
      el("header", {}, el("div", {}, el("div", { class: "num", text: `제${i + 1}장 · ${c.period} · 이야기 ${c.eps.length}개` }), title), el("div", { class: "ctrl" }, btn)),
      body));
  });
  const checks = S.episodes.filter((e) => e.uncertain || e.visibility === "확인 필요");
  const priv = S.episodes.filter((e) => e.visibility === "비공개");
  if (checks.length || priv.length) {
    const r = el("div", { class: "review" });
    if (checks.length) { r.append(el("h4", { text: "가족이 확인할 것" })); const ul = el("ul"); checks.forEach((e) => ul.append(el("li", { text: `${e.title}: ${e.uncertain || "제3자 관련 내용 — 넣어도 되는지 확인"}` }))); r.append(ul); }
    if (priv.length) { r.append(el("h4", { text: "책에서 뺀 이야기 (비공개)" })); const ul = el("ul"); priv.forEach((e) => ul.append(el("li", { text: e.title }))); r.append(ul); }
    box.append(r);
  }
}
async function writeChapter(c, bodyEl, btn, titleEl) {
  if (!sample) return;
  btn.disabled = true; const old = btn.textContent; btn.textContent = "쓰는 중…";
  bodyEl.textContent = "";
  const cards = c.eps.map((e) => JSON.stringify(e)).join("\n");
  const prompt = EDITOR_RULES + `\n\n[화자] ${JSON.stringify(S.profile)}\n[이 장의 시기] ${c.period}\n[에피소드 카드]\n${cards}`;
  try {
    const { text } = await sample(prompt, { cache: false, onText: ({ text }) => { bodyEl.textContent = text; } });
    const t = text.trim(); const nl = t.indexOf("\n");
    const title = (nl > 0 ? t.slice(0, nl) : c.period + " 시절").replace(/^[#\s*]+/, "").trim();
    const body = (nl > 0 ? t.slice(nl + 1) : t).trim();
    book[c.period] = { title, body };
    titleEl.textContent = title; bodyEl.textContent = body;
    saveAll(); btn.textContent = "다시 쓰기";
    $("btn-dl-html").hidden = !downloads; $("btn-dl-txt").hidden = !downloads;
  } catch (e) {
    bodyEl.textContent = book[c.period]?.body || "";
    $("book-status").textContent = errCopy(e && e.code);
    btn.textContent = old;
  } finally { btn.disabled = false; }
}
$("btn-book-all").addEventListener("click", async () => {
  const arts = [...document.querySelectorAll("#book .chapter")];
  for (const a of arts) {
    const body = a.querySelector(".body"); const btn = a.querySelector(".ctrl button");
    if (!body.textContent.trim()) { btn.click(); await new Promise((r) => { const iv = setInterval(() => { if (!btn.disabled) { clearInterval(iv); r(); } }, 400); }); }
  }
});

// ───────────────────────── 내보내기 ─────────────────────────
function bookParts() {
  return chaptersPlan().filter((c) => book[c.period]?.body).map((c, i) => ({ n: i + 1, title: book[c.period].title || c.period, body: book[c.period].body }));
}
const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
async function dl(filename, data) {
  try { await downloads.save({ filename, data }); $("book-status").textContent = ""; }
  catch (e) { $("book-status").textContent = e && e.code === "unavailable" ? "이 화면에서는 파일 저장을 할 수 없어요." : "저장하지 않았어요."; }
}
$("btn-dl-txt").addEventListener("click", () => {
  const name = (S.profile.honorific || "나") + "의 이야기";
  const txt = name + "\n\n" + bookParts().map((p) => `제${p.n}장 ${p.title}\n\n${p.body}`).join("\n\n\n");
  dl(name + ".txt", txt);
});
$("btn-dl-html").addEventListener("click", () => {
  const name = (S.profile.honorific || "나") + "의 이야기";
  const chapters = bookParts().map((p) => `<section><p class="n">제${p.n}장</p><h2>${esc(p.title)}</h2>${p.body.split(/\n{2,}/).map((para) => `<p>${esc(para).replace(/\n/g, "<br>")}</p>`).join("")}</section>`).join("");
  const html = `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(name)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>body{font-family:"Gowun Batang",Batang,serif;max-width:34em;margin:3em auto;padding:0 1.2em;line-height:2;font-size:12pt;color:#222}
h1{text-align:center;font-size:2em;margin:4em 0}section{page-break-before:always}.n{color:#777;letter-spacing:.15em;font-size:.8em;margin-bottom:0}
h2{margin-top:.2em}p{text-indent:1em;margin:0 0 .9em}</style></head><body><h1>${esc(name)}</h1>${chapters}</body></html>`;
  dl(name + ".html", html);
});

// ───────────────────────── 음성: 받아쓰기·읽어주기 ─────────────────────────
function speak(text) { if (tts) tts.speak(text.slice(0, 2000), { language: "ko" }).catch(() => {}); }
async function setupVoice() {
  const [d, t] = await Promise.all([claude.use("dictation"), claude.use("tts")]);
  tts = t;
  if (!t) $("tts-toggle").parentElement.hidden = true;
  if (d) {
    const mic = $("btn-mic"); mic.hidden = false;
    mic.addEventListener("click", () => {
      if (d.active()) { d.stop().catch(() => {}); return; }
      d.start({ language: "ko" }).catch((e) => {
        if (e && (e.code === "not_granted" || e.code === "unavailable")) mic.hidden = true;
      });
    });
    d.onState(({ state }) => { const on = state !== "idle"; mic.setAttribute("aria-pressed", String(on)); mic.textContent = on ? "■ 그만" : "🎙 말하기"; if (!on) $("partial").textContent = ""; });
    d.onPartial(({ text }) => { $("partial").textContent = text; });
    d.onFinal(({ text }) => { const ta = $("input"); ta.value = ta.value ? ta.value + text : text.trimStart(); autosize(); });
  }
  renderChat();
}

// ───────────────────────── 입력·탭·초기화 ─────────────────────────
function autosize() { const ta = $("input"); ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, window.innerHeight * 0.4) + "px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); send($("input").value); }
});
$("btn-send").addEventListener("click", () => send($("input").value));
for (const c of document.querySelectorAll(".chip")) c.addEventListener("click", () => send(c.dataset.cmd, true));
$("btn-start").addEventListener("click", () => {
  if (!sample) { $("start-status").textContent = "Claude 연결을 기다리는 중이에요. 잠시 후 다시 눌러 주세요."; return; }
  chat = []; renderChat(); interviewerTurn();
});
for (const t of document.querySelectorAll("nav.tabs button")) {
  t.addEventListener("click", () => {
    for (const o of document.querySelectorAll("nav.tabs button")) o.setAttribute("aria-selected", String(o === t));
    for (const v of ["talk", "cards", "book"]) $("view-" + v).hidden = v !== t.dataset.view;
    if (t.dataset.view === "talk") scrollDown(); else window.scrollTo({ top: 0 });
  });
}
$("btn-reset").addEventListener("click", () => {
  const area = $("reset-area");
  const box = el("span", { class: "confirm" }, el("span", { text: "모든 대화와 카드, 원고를 지울까요?" }));
  const yes = el("button", { class: "ghost small", text: "지우기" }); const no = el("button", { class: "ghost small", text: "취소" });
  const resetBtn = $("btn-reset");
  yes.addEventListener("click", async () => { await store.clear(); S = blankState(); chat = []; book = {}; renderAll(); area.replaceChildren(resetBtn); });
  no.addEventListener("click", () => area.replaceChildren(resetBtn));
  box.append(yes, no); area.replaceChildren(box);
});
function renderAll() { renderHeader(); renderChat(); renderCards(); renderBook(); recStatus(); }

(async function boot() {
  renderAll();
  $("start-status").textContent = "불러오는 중…";
  sample = await claude.use("sample");
  downloads = await claude.use("downloads");
  if (!sample) { $("start-status").textContent = "이 화면에서는 Claude와 대화할 수 없어요. claude.ai에서 열어 주세요."; $("btn-start").disabled = true; }
  await store.init();
  const [st, ch, bk] = await Promise.all([store.load("state"), store.load("chat"), store.load("book")]);
  if (st && st.s) S = { ...blankState(), ...st.s };
  if (ch && Array.isArray(ch.m)) chat = ch.m;
  if (bk && bk.b) book = bk.b;
  renderAll();
  if (sample) $("start-status").textContent = store.db ? "" : "기록은 이 브라우저에만 저장돼요.";
  if (chat.length && sample) {
    const last = chat[chat.length - 1];
    if (last.day !== today()) { /* 새 날: 인터뷰어가 먼저 인사하며 이어 갑니다 */ $("chat").append(el("div", { class: "msg cmd", text: "— 다시 오셨어요. 아래에 답하시거나 '이어서 하기'를 눌러 주세요 —" })); }
    if (last.role === "user") {
      const b = el("button", { class: "ghost small", text: "이어서 하기" });
      b.addEventListener("click", () => { b.remove(); interviewerTurn(); });
      $("chat").append(b);
    } else if (last.day !== today()) {
      const b = el("button", { class: "ghost small", text: "이어서 하기" });
      b.addEventListener("click", () => { b.remove(); send("오늘 다시 왔어요. 이어서 해 주세요.", true); });
      $("chat").append(b);
    }
    scrollDown();
  }
  setupVoice();
})();
})();
</script>
